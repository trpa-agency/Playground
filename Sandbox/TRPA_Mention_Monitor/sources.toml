# TRPA Mention Monitor - source configuration
#
# Each [[source]] block is one place to check. `type` selects the adapter:
#   google_news  - Google News RSS search (one query per `queries` entry)
#   bing_news    - Bing News RSS search
#   rss          - any RSS/Atom feed; items are text-searched for TRPA mentions
#   legistar     - Legistar Web API (client = the slug in webapi.legistar.com/v1/<client>)
#   granicus     - Granicus ViewPublisher meeting list (host + view_id)
#   municode     - Municode Meetings (client_code)
#   civicplus    - CivicPlus AgendaCenter (base_url of the site)
#
# Set `enabled = false` to skip a source without deleting it.
# Set `packets = true` on a meeting source to always scan its full agenda packets
# (otherwise only done with --packets). Useful for small agencies with few meetings.

[settings]
# Patterns matched (case-insensitive) against document text.
patterns = ['\bTahoe\s+Regional\s+Planning\s+Agency\b', '\bTRPA\b']

# Meetings whose body/meeting name matches any of these are skipped
# (TRPA's own Governing Board and Advisory Planning Commission).
exclude_meeting_patterns = [
  '(TRPA|Tahoe Regional Planning Agency).*(Governing Board|Advisory Planning Commission|\bAPC\b)',
  '^\s*(TRPA\s+)?Governing Board\b',
  '^\s*(TRPA\s+)?Advisory Planning Commission\b',
]

# Recurring boilerplate that names TRPA but isn't substantive. A hit is ignored when
# one of these phrases, including the TRPA mention itself, surrounds it. Add phrases
# here if a source keeps producing the same non-substantive mention.
ignore_context_patterns = [
  # Washoe County BCC agendas list every commissioner's liaison board assignments.
  'Tahoe Prosperity Center Board of Directors\s+Tahoe Regional Planning Agency Governing Board\s+Tahoe Transportation District',
  # Map credits, e.g. "Sources: TRPA, Tahoe Conservancy".
  'Sources?:\s*(?:[\w ]{1,40},\s*){0,5}TRPA',
  # TTD meets in TRPA's building: "Agenda Tahoe Regional Planning Agency October 7, 2026 128 Market Street",
  # "open to the public at Tahoe Regional Planning Agency, Stateline, NV".
  'Tahoe Regional Planning Agency\s+(\w+\s+\d{1,2},\s+\d{4}\s+)?128 Market Street',
  'public at (the )?Tahoe Regional Planning Agency,?\s+(128 Market Street,?\s+)?Stateline',
  # Minutes: "called to order ... at the Tahoe Regional Planning Agency and via Zoom".
  # Stays within one sentence ("p.m." and "Ms. Bagwell" are fine; ". The" is not) and never
  # spans another mention.
  'called to order(?:(?!(?<!\bM[rs])(?<!\bMrs)(?<!\bDr)\.\s+(?-i:[A-Z])|TRPA|Tahoe Regional).){0,80}? at (the )?Tahoe Regional Planning Agency',
]

# Press items from these domains are skipped (TRPA's own site is not "press").
exclude_domains = ["trpa.gov"]

